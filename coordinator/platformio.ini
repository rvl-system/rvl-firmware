; PlatformIO Project Configuration File
;
; The transport coordinator: runs the WiFi access point, sends clock reference
; broadcasts, and assigns device IDs. Its own project rather than an env in the
; root platformio.ini because it shares no source with the boards and needs
; none of their dependencies.

[env:coordinator]
; Must match the root platformio.ini's [extra] platform, which can't be shared
; across projects. The bare "espressif32" name resolves to whatever is installed
; under it, which on a fresh machine is the official platform: that one lacks
; wifi_ap_config_t.dtim_period, and this doesn't compile against it
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32dev
framework = arduino
upload_speed = 921600
lib_deps = symlink://../lib/rvl
build_flags =
  -DLOG_DEBUG_ENABLED
  -DDEFAULT_WIFI_SSID='"${sysenv.DEFAULT_WIFI_SSID}"'
  -DDEFAULT_WIFI_PASSPHRASE='"${sysenv.DEFAULT_WIFI_PASSPHRASE}"'
