; PlatformIO Project Configuration File
;
; The transport coordinator: runs the WiFi access point, sends clock reference
; broadcasts, and assigns device IDs. Its own project rather than an env in the
; root platformio.ini because it shares no source with the boards and needs
; none of their dependencies.

[env:coordinator]
platform = espressif32
board = esp32dev
framework = arduino
upload_speed = 921600
lib_deps = symlink://../lib/rvl
build_flags =
  -DLOG_DEBUG_ENABLED
  -DDEFAULT_WIFI_SSID='"${sysenv.DEFAULT_WIFI_SSID}"'
  -DDEFAULT_WIFI_PASSPHRASE='"${sysenv.DEFAULT_WIFI_PASSPHRASE}"'
