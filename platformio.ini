; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[extra]
; The official platformio/espressif32 platform is still on Arduino core 2.0.17
; (IDF 4.x) and has not moved to core 3.x, so it lacks APIs the coordinator
; needs. pioarduino is the community fork that tracks current cores. Pinned to
; an explicit release rather than the "stable" alias so builds are reproducible
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip

; The default table splits 4MB into two OTA app slots, capping the app at
; 1.3MB. We flash over serial and never OTA, so the second slot is dead space.
; huge_app gives the app 3MB and keeps nvs at the same offset, so stored
; settings survive the change
partitions = huge_app.csv

build_flags =
  -DLOG_DEBUG_ENABLED
  -DDEFAULT_WIFI_SSID='"${sysenv.DEFAULT_WIFI_SSID}"'
  -DDEFAULT_WIFI_PASSPHRASE='"${sysenv.DEFAULT_WIFI_PASSPHRASE}"'

[env:controller]
platform = ${extra.platform}
board = esp32dev
board_build.partitions = ${extra.partitions}
framework = arduino
upload_speed = 921600
; The ESP8266 transport, which main.cpp includes only under #ifndef ESP32
lib_ignore = RVLArduinoWiFi
lib_deps =
	fastled/FastLED @ ^3.10.3
	thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@^4.6.1
build_flags =
  -DHAS_UI
  -DHAS_LIGHTS
  -DRVL_CONTROLLER
  -Os
  ${extra.build_flags}

[env:receiver]
platform = ${extra.platform}
board = esp32dev
board_build.partitions = ${extra.partitions}
framework = arduino
upload_speed = 921600
; The ESP8266 transport, which main.cpp includes only under #ifndef ESP32
lib_ignore = RVLArduinoWiFi
lib_deps =
	fastled/FastLED @ ^3.10.3
	thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@^4.6.1
build_flags =
  -DHAS_CONTROLS
  -DHAS_LIGHTS
  -DRVL_RECEIVER
  -Os
  ${extra.build_flags}

; The ESP8266 transport is a submodule shared with other projects, and no board
; here runs it. This env is the only thing that compiles it: main.cpp includes
; it under #ifndef ESP32, so the dependency finder pulls it in.
;
; HAS_CONTROLS and HAS_UI are deliberately absent: that code is ESP32 specific,
; and its bodies are guarded, so it compiles to nothing here. RVL_ESP8266
; selects a config whose LED pin is valid on this chip, since FastLED validates
; pin numbers at compile time
[env:esp8266]
platform = espressif8266
board = nodemcuv2
framework = arduino
; By manifest name, not folder: the ESP32 transport is never built here, and
; without this the LDF compiles it and fails on AsyncUDP.h
lib_ignore = RVLESP32WiFi
lib_deps =
	fastled/FastLED @ ^3.10.3
build_flags =
  -DHAS_LIGHTS
  -DRVL_ESP8266
  -Os
  ${extra.build_flags}

[env:compiledb]
platform = ${extra.platform}
board = esp32dev
board_build.partitions = ${extra.partitions}
framework = arduino
upload_speed = 921600
lib_deps =
	fastled/FastLED @ ^3.10.3
	thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@^4.6.1
build_flags =
  -DHAS_UI
  -DHAS_LIGHTS
  -DRVL_CONTROLLER
  -Os
  ${extra.build_flags}
extra_scripts = post:compiledb_path.py
